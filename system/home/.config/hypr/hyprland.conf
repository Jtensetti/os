# Forge OS — Hyprland. Ändra genom att säga till: forge system "…"
source = ~/.config/forge/theme.conf

monitor = , preferred, auto, 1

$terminal = alacritty
$launcher = fuzzel

exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = hyprpaper
exec-once = forge system apply --user  # skills, REA m.m. första gången

input {
  kb_layout = se
  follow_mouse = 1
  touchpad { natural_scroll = true }
}

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = $accent
  col.inactive_border = $border
  layout = dwindle
}

decoration {
  rounding = 10
}

animations {
  enabled = true
}

$mod = SUPER

# Forge — kärnan i systemet
bind = $mod, A, exec, forge-prompt new          # beskriv en ny app
bind = $mod, E, exec, forge-prompt edit         # ändra appen som har fokus
bind = $mod SHIFT, A, exec, forge-prompt system # ändra själva systemet
bind = $mod, slash, exec, forge-prompt agent    # öppen chatt med agenten

# Grunder
bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $launcher
bind = $mod, W, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Agentfönster flyter centrerat
windowrulev2 = float, class:^(forge-agent)$
windowrulev2 = size 60% 70%, class:^(forge-agent)$
windowrulev2 = center, class:^(forge-agent)$
