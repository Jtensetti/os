# Forge OS — Hyprland. Ändra genom att be om det: forge system "…"
# Färger kommer från temat (forge theme) via colors.conf.

monitor = , preferred, auto, 1

$terminal = alacritty
$launcher = fuzzel

exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = forge system apply --user  # tema, bakgrund, skills, REA m.m.

env = XCURSOR_SIZE, 24
env = GDK_SCALE, 1

input {
  kb_layout = se
  follow_mouse = 1
  repeat_rate = 40
  repeat_delay = 250
  touchpad {
    natural_scroll = true
    clickfinger_behavior = true
  }
}

general {
  gaps_in = 6
  gaps_out = 14
  border_size = 2
  layout = dwindle
  resize_on_border = true
}

decoration {
  rounding = 14
  active_opacity = 1.0
  inactive_opacity = 0.94

  shadow {
    enabled = true
    range = 24
    render_power = 3
    offset = 0 8
  }

  blur {
    enabled = true
    size = 7
    passes = 3
    noise = 0.02
    vibrancy = 0.2
    popups = true
  }

  dim_inactive = true
  dim_strength = 0.06
}

animations {
  enabled = true
  bezier = snappy, 0.05, 0.9, 0.1, 1.05
  bezier = smooth, 0.25, 1, 0.5, 1
  animation = windows, 1, 5, snappy, popin 85%
  animation = windowsOut, 1, 4, smooth, popin 85%
  animation = border, 1, 8, default
  animation = borderangle, 1, 60, smooth, loop
  animation = fade, 1, 5, smooth
  animation = workspaces, 1, 5, snappy, slidefade 20%
  animation = layers, 1, 4, snappy, popin 90%
}

dwindle {
  pseudotile = true
  preserve_split = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  focus_on_activate = true
}

# Tema sist så att det vinner.
source = ~/.config/hypr/colors.conf

$mod = SUPER

# --- Forge: kärnan i systemet
bind = $mod, A, exec, forge-prompt new          # beskriv en ny app
bind = $mod, E, exec, forge-prompt edit         # ändra appen som har fokus
bind = $mod SHIFT, A, exec, forge-prompt system # ändra själva systemet
bind = $mod, slash, exec, forge-prompt agent    # öppen chatt med agenten
bind = $mod SHIFT, T, exec, forge theme next    # nästa tema

# --- Grunder
bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $launcher
bind = $mod, W, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod CTRL, L, exec, forge-lock
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, PRINT, exec, grim - | wl-copy

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# --- Fönsterregler (Hyprland 0.53+: blocksyntax)
windowrule {
  # Agentfönstret flyter centrerat, med lite glas.
  name = forge-agent
  match:class = ^(forge-agent)$
  float = yes
  size = monitor_w*0.62 monitor_h*0.72
  center = yes
  opacity = 0.96 0.9
}

windowrule {
  name = terminal-glass
  match:class = ^(Alacritty)$
  opacity = 0.95 0.9
}

windowrule {
  name = no-maximize-requests
  match:class = .*
  suppress_event = maximize
}

layerrule {
  name = glass-bar
  match:namespace = ^(waybar)$
  blur = yes
  ignore_alpha = 0
}

layerrule {
  name = glass-popups
  match:namespace = ^(launcher|notifications)$
  blur = yes
}
