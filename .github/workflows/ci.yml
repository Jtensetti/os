name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - run: shellcheck -x bin/* libexec/forge-apply libexec/forge-sandbox libexec/forge-firstboot install.sh iso/build.sh tests/run.sh tests/fake-agent system/hooks/*/*.sh
      - run: python3 -m py_compile libexec/forge-theme libexec/forge-serve
      - run: tests/run.sh
